replicaCount: 2

image:
  repository: ghcr.io/mtw/api-gateway
  tag: '0.1.0'
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 3000

resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: '1'
    memory: 1Gi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70

env:
  DEPLOY_MODE: monolith
  NODE_ENV: production

ingress:
  enabled: true
  className: nginx
  hosts:
    - host: api.mtw.com
      paths:
        - path: /
          pathType: Prefix
