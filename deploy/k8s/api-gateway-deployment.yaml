apiVersion: apps/v1
kind: Deployment
metadata:
  name: mtw-api-gateway
  labels:
    app: mtw-api-gateway
spec:
  replicas: 2
  selector:
    matchLabels:
      app: mtw-api-gateway
  template:
    metadata:
      labels:
        app: mtw-api-gateway
    spec:
      containers:
        - name: api-gateway
          image: ghcr.io/mtw/api-gateway:0.1.0
          ports:
            - containerPort: 3000
          envFrom:
            - secretRef:
                name: mtw-backend-secrets
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health/live
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: mtw-api-gateway
spec:
  selector:
    app: mtw-api-gateway
  ports:
    - port: 80
      targetPort: 3000
