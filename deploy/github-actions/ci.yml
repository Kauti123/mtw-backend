name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-test-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root_secret
          MYSQL_DATABASE: mtw
          MYSQL_USER: mtw
          MYSQL_PASSWORD: mtw_secret
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -umtw -pmtw_secret"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=3s
          --health-retries=10

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12.9.1

      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Prisma generate
        run: pnpm prisma:generate
        env:
          DATABASE_URL: mysql://mtw:mtw_secret@localhost:3306/mtw

      - name: Unit tests
        run: pnpm test
        env:
          DATABASE_URL: mysql://mtw:mtw_secret@localhost:3306/mtw
          REDIS_URL: redis://localhost:6379
          JWT_ACCESS_SECRET: ci-access-secret-min-32-characters!!
          JWT_REFRESH_SECRET: ci-refresh-secret-min-32-characters!
          CREDENTIAL_ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef

      - name: Build
        run: pnpm build

      - name: Image scan placeholder
        run: echo "Trivy/Grype scan hook — add when registry is configured"
